# Local self-hosted Matrix stack: Synapse + Element Web.
# Run from repo root: scripts/install-local-element-docker.ps1

name: element-messenger

services:
    synapse:
        image: synapse-erp:local
        build: ./synapse-erp
        restart: unless-stopped
        env_file: ./synapse-erp/erp-auth.env
        environment:
            SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
        volumes:
            - ./data/synapse:/data
        ports:
            - "0.0.0.0:8008:8008"

    element-web:
        image: vectorim/element-web:latest
        restart: unless-stopped
        depends_on:
            - synapse
        volumes:
            # Serve this repo's built assets (run `pnpm build` in apps/web after code changes).
            - ../../apps/web/webapp:/app
            - ./element/config.json:/app/config.json:ro
        ports:
            - "0.0.0.0:8090:80"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:80/config.json || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s

